@let alwaysShowAnswers = alwaysShowAnswers$ | async;

<div class="shell">
  <mat-toolbar class="topbar">
    <a class="brand" routerLink="/questions">
      <mat-icon>school</mat-icon>
      <span>Interview</span>
    </a>
    <nav class="nav">
      @for (item of navItems; track item.url) {
        <a
          mat-button
          class="nav-link"
          [routerLink]="item.url"
          routerLinkActive="active"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          {{ item.name }}
        </a>
      }
    </nav>
    <button
      type="button"
      class="mode-toggle"
      [class.on]="alwaysShowAnswers"
      (click)="toggleAlwaysShowAnswers()"
      [attr.aria-pressed]="alwaysShowAnswers"
    >
      <span class="switch" [class.on]="alwaysShowAnswers" aria-hidden="true"></span>
      Always show answers
    </button>
  </mat-toolbar>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
