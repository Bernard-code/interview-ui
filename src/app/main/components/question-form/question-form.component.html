<form [formGroup]="questionForm" class="form">
  <header class="form-head">
    <p class="kicker">{{ isEdit ? 'Edit question' : 'New question' }}</p>
    <button type="button" class="icon-btn" (click)="close()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <label class="field">
    <span>Name</span>
    <input formControlName="name" type="text" placeholder="e.g. What is a closure?" autocomplete="off">
  </label>

  <label class="field">
    <span>Answer</span>
    <app-answer-editor
      formControlName="answer"
      class="text-editor"
    ></app-answer-editor>
    <p class="hint">
      Enter and Tab are kept. Emoji: system picker (Win + . or Ctrl + Cmd + Space).
    </p>
  </label>

  <div class="row">
    <label class="field">
      <span>Position</span>
      <input formControlName="position" type="number" min="0" placeholder="1">
    </label>

    <label class="field">
      <span>Category</span>
      <select formControlName="category">
        @for (category of categories; track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
    </label>
  </div>

  <div class="actions">
    <button type="button" class="chip-btn" (click)="close()">Cancel</button>
    <button
      type="button"
      class="chip-btn primary"
      [class.active]="questionForm.valid"
      [disabled]="!questionForm.valid"
      (click)="submitForm()"
    >Save</button>
  </div>
</form>
