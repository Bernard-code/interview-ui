<div class="container">
  @if (question) {
    <p class="kicker">Question</p>
    <h2 class="name">{{ question.name }}</h2>
    <div class="btn-group">
      <button class="btn" mat-stroked-button type="button" (click)="flipAnswer()">
        {{ showAnswer ? 'Hide answer' : 'Show answer' }}
      </button>
      <button class="btn icon-btn" mat-stroked-button type="button" (click)="move(false)" aria-label="Previous question">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button class="btn icon-btn" mat-stroked-button type="button" (click)="move()" aria-label="Next question">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
    @if (showAnswer) {
      <div class="answer" [innerHTML]="question.answer"></div>
    }
  } @else {
    <div class="placeholder">
      <mat-icon>menu_book</mat-icon>
      <p>Select a category, then a question.</p>
    </div>
  }
</div>
