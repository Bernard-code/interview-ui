<div class="wrap">
  @if (question(); as current) {
    <article class="card">
      <header class="card-head">
        <p class="kicker">
          Question
          @if (questionCount) {
            <span class="count">{{ questionIndex }} / {{ questionCount }}</span>
          }
        </p>
        <div class="nav-btns">
          <button type="button" class="icon-btn" (click)="move(false)" aria-label="Previous question">
            <mat-icon>chevron_left</mat-icon>
          </button>
          <button type="button" class="icon-btn" (click)="move()" aria-label="Next question">
            <mat-icon>chevron_right</mat-icon>
          </button>
        </div>
      </header>

      <h2 class="name">{{ current.name }}</h2>

      <div class="card-actions">
        <button
          type="button"
          class="chip-btn"
          [class.active]="showAnswer()"
          (click)="flipAnswer()"
        >
          <mat-icon>{{ showAnswer() ? 'visibility_off' : 'visibility' }}</mat-icon>
          {{ showAnswer() ? 'Hide answer' : 'Show answer' }}
        </button>

        <div class="score-btns">
          <button
            type="button"
            class="score-btn good"
            (click)="markAnswer('good')"
            aria-label="Mark as good"
          >
            <mat-icon>thumb_up</mat-icon>
            <span>{{ current.positiveCount ?? 0 }}</span>
          </button>
          <button
            type="button"
            class="score-btn bad"
            (click)="markAnswer('bad')"
            aria-label="Mark as bad"
          >
            <mat-icon>thumb_down</mat-icon>
            <span>{{ current.negativeCount ?? 0 }}</span>
          </button>
          <button
            type="button"
            class="score-btn reset"
            (click)="resetScores()"
            [disabled]="!(current.positiveCount || current.negativeCount)"
            aria-label="Reset both scores"
          >
            <mat-icon>restart_alt</mat-icon>
            Reset
          </button>
        </div>
      </div>

      @if (showAnswer()) {
        <div class="answer" [innerHTML]="trustedAnswer()"></div>
      }
    </article>
  } @else {
    <div class="placeholder">
      <div class="placeholder-icon">
        <mat-icon>menu_book</mat-icon>
      </div>
      <p class="placeholder-title">No question selected</p>
      <p class="placeholder-hint">Pick a category, then a question from the list.</p>
    </div>
  }
</div>
